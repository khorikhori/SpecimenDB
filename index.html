<!DOCTYPE html>

<html lang="ja">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>植物標本データベース</title>


<!-- ==========================================
     Bootstrap
     ========================================== -->

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet">


<!-- ==========================================
     DataTables
     ========================================== -->

<link
    href="https://cdn.datatables.net/2.3.2/css/dataTables.bootstrap5.css"
    rel="stylesheet">


<!-- ==========================================
     自作CSS
     ========================================== -->

<link
    rel="stylesheet"
    href="css/style.css">


</head>

<body>

<div class="container-fluid py-4">


<!-- ==========================================
     タイトル
     ========================================== -->

<h1 class="text-center mb-4">
    植物標本データベース
</h1>


<!-- ==========================================
     検索
     ========================================== -->

<section id="search-section"
         class="card mb-4">

    <div class="card-header">
        <h2 class="h5 mb-0">
            検索
        </h2>
<div class="card-header">
    <h2 class="h5 mb-0">
        検索
    </h2>
</div>

<div class="card-body">

    <div
        id="searchForm"
        class="row g-3">
    </div>

    <div class="mt-4">

        <button
            id="searchButton"
            type="button"
            class="btn btn-primary me-2">

            検索

        </button>

        <button
            id="resetButton"
            type="button"
            class="btn btn-secondary">

            リセット

        </button>

    </div>

</div>

</section>


<!-- ==========================================
     検索結果
     ========================================== -->

<section id="result-section">

    <div class="d-flex
                justify-content-between
                align-items-center
                mb-3">

        <h2 class="h5 mb-0">
            検索結果
        </h2>


        <div id="result-summary">

            検索結果：
            <strong>
                <span id="resultCount">0</span>
            </strong>
            件

        </div>

    </div>


    <!-- ======================================
         DataTables

         テーブルのtheadはCSVのヘッダーから
         JavaScriptで自動生成する。

         tbodyも検索結果から
         JavaScriptで生成する。
         ====================================== -->

    <div class="table-responsive">

        <table
            id="specimenTable"
            class="table
                   table-striped
                   table-bordered
                   table-hover
                   w-100">

            <thead>

                <tr id="result-header-row">
                </tr>

            </thead>


            <tbody id="result-body">
            </tbody>

        </table>

    </div>

</section>


</div>

<!-- ==========================================
     jQuery
     ========================================== -->

<script
    src="https://code.jquery.com/jquery-3.7.1.min.js">
</script>

<!-- ==========================================
     Bootstrap
     ========================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

<!-- ==========================================
     DataTables
     ========================================== -->

<script
    src="https://cdn.datatables.net/2.3.2/js/dataTables.js">
</script>

<script
    src="https://cdn.datatables.net/2.3.2/js/dataTables.bootstrap5.js">
</script>

<!-- ==========================================
     Papa Parse

     CSV読み込み用
     ========================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js">
</script>

<!-- ==========================================
     自作JavaScript

     読み込み順が重要

     1. csv-loader.js
     2. search.js
     3. table.js
     4. app.js
     ========================================== -->

<script src="js/csv-loader.js"></script>

<script src="js/search.js"></script>

<script src="js/table.js"></script>

<script src="js/app.js"></script>

</body>

</html>
